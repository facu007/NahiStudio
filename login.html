<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahi Studio | Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#111111",
            surface: "#181818",
            primary: "#C7C7C7",
            "primary-bright": "#8B2635",
            "primary-light": "#F1ECE5",
            secondary: "#D4AF37",
          },
          fontFamily: {
            display: ["'Bodoni Moda'", "serif"],
            body: ["'Plus Jakarta Sans'", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    .neon-card-glow {
      border: 1.5px solid rgba(139, 38, 53, 0.5);
      box-shadow: 0 0 35px 2px rgba(139, 38, 53, 0.25), inset 0 0 25px rgba(139, 38, 53, 0.08);
    }
  </style>
</head>
<body class="bg-[#111111] text-[#f5edf5] font-body min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-[#C7C7C7] selection:text-white">
  
  <!-- Ambient background glow -->
  <div class="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#8B2635]/15 blur-[120px] rounded-full pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 space-y-6">
    
    <!-- Header de Marca -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-2 group">
        <span class="font-display font-bold text-2xl sm:text-3xl tracking-wider text-white uppercase group-hover:text-[#C7C7C7] transition-colors">
          NAHI STUDIO
        </span>
        <span class="text-[#C7C7C7] text-sm">♡</span>
      </a>
      <p class="text-xs uppercase font-bold tracking-widest text-[#D4AF37]">
        Two Sides · One Identity • Nail Art & Tattoo Art
      </p>
      <p class="text-xs text-[#d8c4d6] pt-1">
        Ingresá para gestionar tus turnos, compras e inscripciones
      </p>
    </div>

    <!-- Card Principal -->
    <div class="neon-card-glow bg-[#181818] rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <!-- Banner Contextual (Admin o Turnos) -->
      <div id="auth-context-banner" class="hidden px-4 py-3 rounded-2xl bg-[#8B2635]/20 border border-[#D4AF37]/40 text-xs text-[#F1ECE5] text-center font-semibold"></div>

      <!-- Tabs Iniciar Sesión / Registrarse -->
      <div class="flex p-1 bg-[#111111] rounded-2xl border border-white/10">
        <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all bg-[#8B2635] text-white shadow-md">
          Iniciar Sesión
        </button>
        <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all text-[#d8c4d6] hover:text-white">
          Registrarse
        </button>
      </div>

      <!-- Formulario 1: Login -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
            Email
          </label>
          <input type="email" id="login-email" required placeholder="tu@email.com" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
              Contraseña
            </label>
            <a href="#" onclick="alert('Si olvidaste tu contraseña de clienta, podés registrarte con otro correo o escribirnos por WhatsApp al estudio.'); return false;" class="text-[11px] text-[#D4AF37] hover:underline">
              ¿Olvidaste tu clave?
            </a>
          </div>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <button type="submit" id="btn-submit-login" class="w-full inline-flex justify-center items-center gap-2 bg-gradient-to-r from-[#8B2635] to-[#D4AF37] hover:brightness-110 text-white py-3.5 px-4 rounded-full font-bold text-xs uppercase tracking-wider shadow-lg shadow-[#8B2635]/30 transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-base">login</span>
          <span id="btn-submit-login-text">Iniciar Sesión</span>
        </button>

        <div id="login-status" class="text-center text-xs min-h-[1.2rem] font-semibold"></div>
      </form>

      <!-- Formulario 2: Registro -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
            Nombre completo *
          </label>
          <input type="text" id="reg-name" required placeholder="Ej. Valentina Gómez" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
            Teléfono / WhatsApp *
          </label>
          <input type="tel" id="reg-phone" required placeholder="Ej. 291 1234567" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
            Email *
          </label>
          <input type="email" id="reg-email" required placeholder="tu@email.com" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#F1ECE5]">
            Crear Contraseña *
          </label>
          <input type="password" id="reg-password" required minlength="4" placeholder="Mínimo 4 caracteres" class="w-full bg-[#111111] border border-[#C7C7C7]/40 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#C7C7C7] text-sm placeholder:text-white/30">
        </div>

        <button type="submit" id="btn-submit-reg" class="w-full inline-flex justify-center items-center gap-2 bg-gradient-to-r from-[#8B2635] to-[#D4AF37] hover:brightness-110 text-white py-3.5 px-4 rounded-full font-bold text-xs uppercase tracking-wider shadow-lg shadow-[#8B2635]/30 transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-base">person_add</span>
          <span>Crear Cuenta y Continuar</span>
        </button>

        <div id="reg-status" class="text-center text-xs min-h-[1.2rem] font-semibold"></div>
      </form>

      <!-- Acceso para Administración con Contraseña -->
      <div class="pt-3 border-t border-white/10 text-center space-y-2">
        <p class="text-[11px] text-[#d8c4d6]">
          🔒 Para reservar turnos o administrar el estudio es obligatorio iniciar sesión.
        </p>
        <button type="button" onclick="prepareAdminLogin()" class="inline-flex items-center gap-1.5 text-xs text-[#D4AF37] hover:text-white font-bold underline transition-colors pt-1">
          <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
          <span>Acceso Administradora (Estudio)</span>
        </button>
      </div>

    </div>

    <!-- Volver al sitio -->
    <div class="text-center">
      <a href="index.html" class="inline-flex items-center gap-1 text-xs text-[#d8c4d6] hover:text-[#C7C7C7] transition-colors">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        <span>Volver a la página principal</span>
      </a>
    </div>

  </div>

  <script src="supabase-client.js?v=20261131"></script>
  <script>
    function getRedirectTarget(user) {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || '';
      const side = params.get('side') || '';
      if (user && user.role === 'admin') {
        if (redirect === 'turnos') {
          return side ? `turnos.html?side=${encodeURIComponent(side)}` : 'turnos.html';
        }
        return 'admin.html';
      }
      return side ? `turnos.html?side=${encodeURIComponent(side)}` : 'turnos.html';
    }

    function prepareAdminLogin() {
      switchAuthTab('login');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const adminEmail = (window.MicaBackend && window.MicaBackend.auth && window.MicaBackend.auth.getAdminEmail)
        ? window.MicaBackend.auth.getAdminEmail()
        : 'admin@nahistudio.com';
      if (emailInput) emailInput.value = adminEmail;
      if (passInput) {
        passInput.value = '';
        passInput.focus();
      }
      const banner = document.getElementById('auth-context-banner');
      if (banner) {
        banner.textContent = '🔒 Ingresá la contraseña de Administradora para abrir el Panel del Estudio.';
        banner.classList.remove('hidden');
      }
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all bg-[#8B2635] text-white shadow-md';
        tabReg.className = 'flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all text-[#d8c4d6] hover:text-white';
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all bg-[#8B2635] text-white shadow-md';
        tabLogin.className = 'flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold uppercase tracking-wider transition-all text-[#d8c4d6] hover:text-white';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const status = document.getElementById('login-status');
      const btn = document.getElementById('btn-submit-login');
      
      btn.disabled = true;
      status.textContent = 'Verificando credenciales...';
      status.className = 'text-center text-xs mt-2 text-[#F1ECE5]';

      try {
        const res = await window.MicaBackend.login(email, password);
        const params = new URLSearchParams(window.location.search);
        if (params.get('redirect') === 'admin' && (!res.user || res.user.role !== 'admin')) {
          window.MicaBackend.auth.logout();
          throw new Error('Esta cuenta no tiene permisos de Administradora. Ingresá con el correo del estudio.');
        }

        status.textContent = '¡Bienvenida! Redirigiendo...';
        status.className = 'text-center text-xs mt-2 text-[#25D366] font-bold';

        setTimeout(() => {
          window.location.href = getRedirectTarget(res.user);
        }, 400);
      } catch (err) {
        btn.disabled = false;
        status.textContent = err.message || 'Error al iniciar sesión.';
        status.className = 'text-center text-xs mt-2 text-red-400 font-bold';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const status = document.getElementById('reg-status');
      const btn = document.getElementById('btn-submit-reg');

      btn.disabled = true;
      status.textContent = 'Creando tu cuenta...';
      status.className = 'text-center text-xs mt-2 text-[#F1ECE5]';

      try {
        const res = await window.MicaBackend.register({ name, phone, email, password });
        status.textContent = '¡Cuenta creada con éxito! Redirigiendo a Turnos...';
        status.className = 'text-center text-xs mt-2 text-[#25D366] font-bold';

        setTimeout(() => {
          window.location.href = getRedirectTarget(res.user);
        }, 400);
      } catch (err) {
        btn.disabled = false;
        status.textContent = err.message || 'Error al crear la cuenta.';
        status.className = 'text-center text-xs mt-2 text-red-400 font-bold';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      const banner = document.getElementById('auth-context-banner');

      if (redirect === 'admin') {
        if (window.MicaBackend && window.MicaBackend.auth && window.MicaBackend.auth.isAdmin()) {
          window.location.replace('admin.html');
          return;
        }
        prepareAdminLogin();
      } else if (redirect === 'turnos') {
        if (window.MicaBackend && window.MicaBackend.auth && window.MicaBackend.auth.isAuthenticated()) {
          window.location.replace(getRedirectTarget(window.MicaBackend.auth.getUser()));
          return;
        }
        if (banner) {
          banner.textContent = '✨ Iniciá sesión o registrate gratis en segundos para reservar tu turno.';
          banner.classList.remove('hidden');
        }
      } else {
        const savedUser = window.MicaBackend.getCurrentUser();
        if (savedUser && savedUser.email && document.getElementById('login-email')) {
          document.getElementById('login-email').value = savedUser.email;
        }
      }
    });
  </script>
</body>
</html>
