<!-- Button (Actions) -->

<!-- Variant: Primary -->
<div class="flex flex-wrap items-center gap-gutter-md">
      <!-- COMPONENT: button-primary -->
      <button
        data-component-id="button-primary"
        data-component-type="button"
        data-component-variant="primary"
        type="button"
        class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md bg-primary text-on-primary border border-primary rounded-none uppercase tracking-widest transition-colors duration-state-change ease-state-change hover:bg-accent hover:text-on-accent hover:border-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-90 disabled:opacity-40 disabled:pointer-events-none"
      >
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Reservar mi turno</span>
      </button>

      <!-- COMPONENT: button-secondary -->
      <button
        data-component-id="button-secondary"
        data-component-type="button"
        data-component-variant="secondary"
        type="button"
        class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md bg-transparent text-on-surface border border-secondary rounded-none uppercase tracking-widest transition-colors duration-state-change ease-state-change hover:bg-surface-container-high hover:border-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:opacity-90 disabled:opacity-40 disabled:pointer-events-none"
      >
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Consultar diseño</span>
      </button>
    </div>

<!-- Variant: Icon -->
<div class="flex flex-wrap items-center gap-gutter-md">
      <!-- COMPONENT: button-icon -->
      <button
        data-component-id="button-icon"
        data-component-type="button"
        data-component-variant="icon"
        type="button"
        aria-label="Cerrar"
        class="inline-flex items-center justify-center w-10 h-10 bg-surface-container text-on-surface border border-outline-variant rounded-full transition-colors duration-state-change ease-state-change hover:border-secondary hover:bg-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        <span class="material-symbols-outlined text-body-lg" aria-hidden="true">close</span>
      </button>
    </div>

<!-- Variant: With Icon -->
<div class="flex flex-wrap items-center gap-gutter-md">
      <!-- COMPONENT: button-with-icon -->
      <button
        data-component-id="button-with-icon"
        data-component-type="button"
        data-component-variant="with-icon"
        type="button"
        class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md bg-accent text-on-accent border border-accent rounded-none uppercase tracking-widest transition-colors duration-state-change ease-state-change hover:bg-primary hover:text-on-primary hover:border-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        <span class="material-symbols-outlined text-body-lg" aria-hidden="true">arrow_outward</span>
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Enviar por WhatsApp</span>
      </button>
    </div>
